---
name: Pipeline
"on":
  push: { branches: [main] }
  pull_request: { branches: [main] }
  schedule: [{ cron: "30 1 * * 0" }]
concurrency: { group: "${{ github.workflow }}-${{ github.ref }}", cancel-in-progress: true }
jobs:
  test:
    if: github.event_name != 'schedule'
    timeout-minutes: 15
    runs-on: ubuntu-latest
    permissions: { contents: read }
    strategy:
      fail-fast: false
      matrix:
        include:
          - { type: unit, node: 22.x, cmd: 'npx --yes vitest run --coverage' }
          - { type: unit, node: 24.x, cmd: 'npx --yes vitest run --coverage' }
          - { type: e2e,  node: 22.x, cmd: 'npm run test:e2e' }
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with: { node-version: "${{ matrix.node }}", cache: 'npm' }
      - run: ${{ matrix.type == 'unit' && 'npm ci --ignore-scripts' || 'npm ci' }}
      - if: matrix.type == 'e2e'
        id: pw
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: "${{ runner.os }}-pw-${{ hashFiles('package-lock.json') }}"
          restore-keys: "${{ runner.os }}-pw-"
      - if: matrix.type == 'e2e'
        run: |
          if [ "${{ steps.pw.outputs.cache-hit }}" != 'true' ]; then npx --yes playwright install chromium; fi
          npx --yes playwright install-deps chromium
      - run: ${{ matrix.cmd }}
      - if: always() && matrix.type == 'e2e'
        uses: actions/upload-artifact@v7
        with: { name: playwright-report, path: playwright-report/, retention-days: 7 }

  analyze:
    runs-on: ubuntu-latest
    permissions: { actions: read, contents: read, security-events: write }
    strategy: { fail-fast: false, matrix: { language: [javascript] } }
    steps:
      - uses: actions/checkout@v7
      - uses: github/codeql-action/init@v4.38.1
        with: { languages: "${{ matrix.language }}" }
      - uses: github/codeql-action/autobuild@v4.38.1
      - uses: github/codeql-action/analyze@v4.38.1
        with: { category: "/language:${{matrix.language}}" }

  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [test]
    environment: { name: github-pages, url: "${{ steps.deployment.outputs.page_url }}" }
    runs-on: ubuntu-latest
    permissions: { contents: read, pages: write, id-token: write }
    steps:
      - uses: actions/checkout@v7
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with: { path: '.' }
      - id: deployment
        uses: actions/deploy-pages@v5
