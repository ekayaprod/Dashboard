---
name: CI Pipeline
"on": { push: { branches: [main] }, pull_request: { branches: [main] } }
concurrency: { group: "${{ github.workflow }}-${{ github.ref }}", cancel-in-progress: true }
jobs:
  test:
    timeout-minutes: 15
    runs-on: ubuntu-latest
    permissions: { contents: read }
    strategy:
      fail-fast: false
      matrix:
        include:
          - { type: unit, node: 20.x, cmd: 'npx vitest run --coverage' }
          - { type: unit, node: 22.x, cmd: 'npx vitest run --coverage' }
          - { type: e2e,  node: 20.x, cmd: 'npm run test:e2e' }
    steps:
      - uses: actions/checkout@v7
      - name: Node ${{ matrix.node }}
        uses: actions/setup-node@v7
        with: { node-version: "${{ matrix.node }}", cache: 'npm' }
      - name: Install Deps
        run: ${{ matrix.type == 'unit' && 'npm ci --ignore-scripts' || 'npm ci' }}
      - name: Playwright Cache
        if: matrix.type == 'e2e'
        id: pw-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-pw-${{ hashFiles('package-lock.json') }}
          restore-keys: ${{ runner.os }}-pw-
      - name: Install Playwright
        if: matrix.type == 'e2e'
        run: |
          if [ "${{ steps.pw-cache.outputs.cache-hit }}" != 'true' ]; then npx playwright install chromium; fi
          npx playwright install-deps chromium
      - name: Run ${{ matrix.type }}
        run: ${{ matrix.cmd }}
      - name: Upload Report
        if: always() && matrix.type == 'e2e'
        uses: actions/upload-artifact@v7
        with: { name: playwright-report, path: playwright-report/, retention-days: 7 }
